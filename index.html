<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBU Red Racing</title>
  <script>
    (function (l) {
      if (l.search && l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('?')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        var newPath = decoded.split('?')[0] || '/';
        var rest = decoded.slice(newPath.length);
        window.history.replaceState(null, null, newPath + rest + l.hash);
      }
    })(window.location);
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
